<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNC SOUL - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="backcss.css">
</head>
<body>
    <div class="topbar">
        <div class="topbar-brand">SYNC <span>SOUL</span> — Admin</div>
        <div class="topbar-right">
            <span class="admin-tag" id="adminWelcome"></span>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="admin-wrapper">
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3"><div class="stat-card"><h2 id="totalUsers">-</h2><p>Total Users</p></div></div>
            <div class="col-6 col-md-3"><div class="stat-card"><h2 id="totalMale">-</h2><p>Male</p></div></div>
            <div class="col-6 col-md-3"><div class="stat-card"><h2 id="totalFemale">-</h2><p>Female</p></div></div>
            <div class="col-6 col-md-3"><div class="stat-card"><h2 id="totalOther">-</h2><p>Other / N/A</p></div></div>
        </div>

        <div class="controls-bar">
            <div class="row g-2">
                <div class="col-md-6">
                    <input type="text" class="form-control" id="searchInput" placeholder="🔍 Search by name, username, email..." oninput="filterUsers()">
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="genderFilter" onchange="filterUsers()">
                        <option value="">All Genders</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="sortBy" onchange="filterUsers()">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="name">Name A-Z</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="table-wrap">
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Photo</th><th>Username</th><th>Name</th><th>Email</th>
                            <th>Phone</th><th>Gender</th><th>Age</th><th>Salary</th><th>Joined</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="10" class="no-data">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- View Modal -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <img id="modalPhoto" class="modal-photo" src="https://via.placeholder.com/90?text=...">
            <h5 class="modal-name" id="modalName"></h5>
            <div id="modalDetails"></div>
        </div>
    </div>

    <!-- Confirm Delete -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-box">
            <h3>⚠️ Delete User?</h3>
            <p id="confirmMsg"></p>
            <div>
                <button class="btn-cancel" onclick="closeConfirm()">Cancel</button>
                <button class="btn-confirm-del" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script src="backjs.js"></script>
    <script src="admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
