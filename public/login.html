<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNC SOUL - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="backcss.css">
    <script src="backjs.js" defer></script>
</head>
<body style="display:flex;align-items:center;justify-content:center;padding:20px;min-height:100vh;">
    <div class="bg-overlay"></div>
    <div style="position:relative;z-index:1;width:100%;max-width:500px;">
        <div class="brand">
            <h1>SYNC SOUL</h1>
            <p>✦ FIND YOUR SOULMATE ✦</p>
        </div>

        <!-- Login -->
        <div class="ss-card" id="loginBox">
            <h2>Welcome Back 💕</h2>
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="logUser" placeholder="Enter username">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="logPass" placeholder="Enter password">
            </div>
            <button class="btn-pink mb-3" onclick="login()">Login</button>
            <div class="switch-link" onclick="showForgot()">Forgot Password?</div>
            <div class="switch-link" onclick="showRegister()">Create New Account</div>
        </div>

        <!-- Register -->
        <div class="ss-card" id="registerBox" style="display:none;">
            <h2>Create Account 💖</h2>
            <div class="row g-2">
                <div class="col-12">
                    <label class="form-label">Username *</label>
                    <input type="text" class="form-control" id="regUser" placeholder="Choose a username">
                </div>
                <div class="col-6">
                    <label class="form-label">Password *</label>
                    <input type="password" class="form-control" id="regPass" placeholder="Min 6 chars">
                </div>
                <div class="col-6">
                    <label class="form-label">Email *</label>
                    <input type="email" class="form-control" id="regEmail" placeholder="your@email.com">
                </div>
                <div class="col-6">
                    <label class="form-label">Phone *</label>
                    <input type="tel" class="form-control" id="regPhone" placeholder="10 digits">
                </div>
                <div class="col-6">
                    <label class="form-label">Gender</label>
                    <input type="text" class="form-control" id="reggender" placeholder="Male/Female/Other">
                </div>
                <div class="col-6">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" id="regdob">
                </div>
                <div class="col-6">
                    <label class="form-label">Caste</label>
                    <input type="text" class="form-control" id="regcast" placeholder="Optional">
                </div>
                <div class="col-6">
                    <label class="form-label">Salary</label>
                    <input type="number" class="form-control" id="regsalary" placeholder="Monthly">
                </div>
                <div class="col-6">
                    <label class="form-label">Father's Name</label>
                    <input type="text" class="form-control" id="regfname" placeholder="Father's name">
                </div>
                <div class="col-6">
                    <label class="form-label">Mother's Name</label>
                    <input type="text" class="form-control" id="regmname" placeholder="Mother's name">
                </div>
                <div class="col-12">
                    <label class="form-label">Bio</label>
                    <textarea class="form-control" id="regbio" rows="2" placeholder="Tell us about yourself..."></textarea>
                </div>
                <div class="col-12">
                    <label class="upload-label" for="regPhoto">
                        <span id="uploadText">📷 Upload Profile Photo</span>
                        <input type="file" id="regPhoto" accept="image/*" onchange="previewPhoto(event)" style="display:none;">
                    </label>
                    <div id="photoPreviewContainer" style="display:none;">
                        <img id="photoPreview" class="photo-preview">
                    </div>
                </div>
            </div>
            <hr class="ss-divider">
            <button class="btn-pink mb-2" onclick="register()">Create Account</button>
            <div id="otpSection" class="otp-box" style="display:none;">
                <label class="form-label">OTP sent to your email</label>
                <input type="text" class="form-control mb-2" id="otpInput" placeholder="Enter 6-digit OTP">
                <button class="btn-pink" onclick="verifyOTP()">Verify OTP</button>
            </div>
            <div class="switch-link mt-2" onclick="showLogin()">Already have an account? Login</div>
        </div>

        <!-- Forgot Password -->
        <div class="ss-card" id="forgotBox" style="display:none;">
            <h2>Reset Password 🔑</h2>
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="forgotUser" placeholder="Your username">
            </div>
            <div class="mb-3">
                <label class="form-label">Registered Email</label>
                <input type="email" class="form-control" id="forgotEmail" placeholder="your@email.com">
            </div>
            <button class="btn-pink mb-3" onclick="sendResetOTP()">Send OTP</button>
            <div id="forgotOtpSection" class="otp-box" style="display:none;">
                <label class="form-label">Enter OTP</label>
                <input type="text" class="form-control mb-2" id="forgotOtpInput" placeholder="6-digit OTP">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control mb-2" id="newPass" placeholder="New password">
                <button class="btn-pink" onclick="verifyResetOTP()">Reset Password</button>
            </div>
            <div class="switch-link mt-2" onclick="showLogin()">← Back to Login</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
